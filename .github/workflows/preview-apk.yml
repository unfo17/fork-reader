name: Build Readium preview APK
on:
  workflow_dispatch:
  push:
    branches: [feat/readium-local-reader]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies and verify parser
        run: |
          flutter pub get
          dart run tools/verify_readium.dart
          dart analyze --no-fatal-warnings lib
      - name: Restore persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.READIUM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.READIUM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.READIUM_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.READIUM_KEY_ALIAS }}
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, os, pathlib, subprocess
          for name in ['KEYSTORE_BASE64','STORE_PASSWORD','KEY_PASSWORD','KEY_ALIAS']:
              if not os.environ.get(name): raise SystemExit('Missing persistent signing secret: '+name)
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'readium-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True));key.chmod(0o600)
          cert=subprocess.check_output(['keytool','-exportcert','-keystore',str(key),'-alias',os.environ['KEY_ALIAS'],'-storepass:env','STORE_PASSWORD'],stderr=subprocess.DEVNULL)
          print('Restored key certificate SHA-256:',hashlib.sha256(cert).hexdigest())
          props=pathlib.Path('android/key.properties')
          props.write_text('storeFile='+str(key)+'\nstorePassword='+os.environ['STORE_PASSWORD']+'\nkeyPassword='+os.environ['KEY_PASSWORD']+'\nkeyAlias='+os.environ['KEY_ALIAS']+'\n');props.chmod(0o600)
          PYCODE
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --build-name=0.5.6-readium-preview.7 --build-number=2308
      - name: Verify and package APK
        env:
          EXPECTED_CERT: ${{ vars.READIUM_SIGNING_SHA256 }}
          STORE_PASSWORD: ${{ secrets.READIUM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.READIUM_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.READIUM_KEY_ALIAS }}
        run: |
          mkdir -p release
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/readium-release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out release/wenku8-readium-preview-arm64-v8a.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose release/*.apk
          export APKSIGNER="$BUILD_TOOLS/apksigner"
          python3 - <<'PYCODE'
          import os, subprocess
          expected=os.environ['EXPECTED_CERT'].lower().replace(':','')
          if len(expected)!=64: raise SystemExit('Pinned signing certificate is missing')
          out=subprocess.check_output([os.environ['APKSIGNER'],'verify','--print-certs','release/wenku8-readium-preview-arm64-v8a.apk'],text=True)
          actual=next(line.rsplit(':',1)[1].strip().lower() for line in out.splitlines() if 'certificate SHA-256 digest:' in line)
          print('APK certificate SHA-256:',actual)
          if actual!=expected: raise SystemExit('Signing certificate differs from the pinned update certificate')
          print('Persistent signing certificate verified:',actual)
          PYCODE
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readium-preview-apk
          path: release/*
      - name: Publish preview release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create readium-preview-20261119.7 release/* --target "$GITHUB_SHA" --prerelease --title "Readium 跟手翻页预览版 7" --notes-file RELEASE_PREVIEW.md
