name: Native Android
on:
  push:
    branches: [master, compose-readium]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m unittest discover -s tools/tests -v
      - run: ./gradlew assembleDebug lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: fork-reader-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Device integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/connected_android_test_additional_output
